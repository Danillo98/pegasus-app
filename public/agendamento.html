<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- Anti-Cache Tags -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Agendamento – Pegasus</title>
  <meta name="description" content="Agende seu serviço de forma rápida e fácil." />
  <!-- Force refresh if old version -->
  <script>
    const APP_VERSION = '1.0.8';
    if (localStorage.getItem('pegasus_app_v') !== APP_VERSION) {
      localStorage.setItem('pegasus_app_v', APP_VERSION);
      location.reload(true);
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Default to Barbearia Theme (Light) */
      --bg: #ffffff;
      --surface: #f9f9f9;
      --surface2: #f0f0f0;
      --border: #e5e5e5;
      --primary: #000000;
      --primary-h: #333333;
      --accent: #555555;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --radius: 1rem;
      --shadow: 0 8px 32px rgba(0,0,0,.08);
      
      /* Base colors */
      --cyan: #06b6d4;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
    }

    body.theme-salao {
      --bg: #ffffff;
      --surface: #FFF5F8;
      --surface2: #FFEBF2;
      --border: #FFD6E5;
      --primary: #FF4D94;
      --primary-h: #e64585;
      --accent: #FF85B3;
      --text: #2D1B22;
      --muted: #8B6B77;
      --shadow: 0 8px 32px rgba(255, 77, 148, 0.15);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 4rem;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* ── Header ── */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      text-align: center;
      width: 100%;
    }
    .logo-container {
      width: 140px;
      margin-bottom: 0.5rem;
    }
    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    .estab-name {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -.5px;
    }
    .estab-type {
      font-size: .8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    /* ── Steps indicator ── */
    .steps {
      display: flex;
      gap: .5rem;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 480px;
    }
    .step-dot {
      flex: 1;
      height: 4px;
      border-radius: 4px;
      background: var(--border);
      transition: background .3s;
    }
    .step-dot.active { background: var(--primary); }
    .step-dot.done   { background: var(--primary); }

    /* ── Section title ── */
    .section-title {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    /* ── Input ── */
    .input {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: .75rem;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      padding: .85rem 1rem;
      outline: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      transition: border-color .2s;
    }
    .input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
    .input::placeholder { color: var(--muted); }
    
    /* Specific fix for date/time/tel inputs on iOS */
    input[type="date"], input[type="time"], input[type="tel"], input[type="text"] {
       font-size: 16px; /* Prevents auto-zoom on iOS */
    }

    /* ── Service item ── */
    .service-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: .9rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: .85rem;
      margin-bottom: .6rem;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      user-select: none;
    }
    .service-item:hover    { border-color: var(--primary); }
    .service-item.selected { border-color: var(--primary); background: var(--surface2); }

    .service-check {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .2s, border-color .2s;
      font-size: .8rem;
    }
    .service-item.selected .service-check {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--surface); /* Contrast checkmark */
    }

    .service-info { flex: 1; min-width: 0; }
    .service-info .s-name  { font-size: .95rem; font-weight: 600; }
    .service-info .s-dur   { font-size: .75rem; color: var(--muted); margin-top: 2px; }
    .service-price { font-size: .95rem; font-weight: 700; color: var(--primary); }
    .service-item.service-disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
      background: var(--surface2);
    }
    .service-item.service-disabled .s-name {
      text-decoration: line-through;
    }

    /* ── Total ── */
    .total-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface2);
      border-radius: .85rem;
      padding: .9rem 1.1rem;
      margin-top: .5rem;
      border: 1.5px solid var(--border);
    }
    .total-label { font-size: .85rem; color: var(--muted); }
    .total-value { font-size: 1.3rem; font-weight: 800; color: var(--text); }

    /* ── Slot ── */
    .slot-item {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem 1.1rem;
      border: 1.5px solid var(--border);
      border-radius: .85rem;
      margin-bottom: .6rem;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      user-select: none;
    }
    .slot-item:hover    { border-color: var(--primary); }
    .slot-item.selected { border-color: var(--primary); background: var(--surface2); }

    .slot-icon {
      width: 44px; height: 44px;
      background: #f3f4f6;
      color: #374151;
      border-radius: .75rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .slot-item.selected .slot-icon {
      background: var(--primary);
      color: var(--surface);
    }
    .slot-info .s-date { font-size: .95rem; font-weight: 600; }
    .slot-info .s-time { font-size: .8rem; color: var(--muted); margin-top: 2px; }

    /* ── PIX section ── */
    .pix-box {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: .85rem;
      padding: 1.2rem;
      margin-top: .5rem;
    }
    .pix-title { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--primary); margin-bottom: .75rem; }
    .pix-value {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface);
      border-radius: .6rem;
      padding: .75rem 1rem;
      font-size: .95rem; font-weight: 600;
      border: 1px solid var(--border);
    }
    .copy-btn {
      background: var(--primary);
      color: var(--surface); /* Contrast text */
      border: none;
      border-radius: .5rem;
      padding: .35rem .75rem;
      font-size: .78rem; font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .copy-btn:hover { background: var(--primary-h); }

    /* ── Button ── */
    .btn {
      width: 100%;
      padding: 1rem;
      background: var(--primary);
      color: var(--surface); /* Deep contrast */
      border: none;
      border-radius: .85rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .2s, transform .1s;
      margin-top: .75rem;
      letter-spacing: .2px;
    }
    .btn:hover    { opacity: .9; }
    .btn:active   { transform: scale(.98); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn.outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--muted);
      margin-top: .4rem;
    }
    .btn.outline:hover { border-color: var(--primary); color: var(--text); }

    /* ── Success screen ── */
    .success-icon {
      width: 72px; height: 72px;
      background: var(--green);
      color: #fff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.25rem;
      box-shadow: 0 0 32px rgba(16,185,129,.4);
      animation: pop .4s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes pop {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .summary-row {
      display: flex; justify-content: space-between;
      padding: .55rem 0;
      border-bottom: 1px solid var(--border);
      font-size: .9rem;
    }
    .summary-row:last-child { border-bottom: none; }
    .summary-row .label { color: var(--muted); }
    .summary-row .value { font-weight: 600; text-align: right; max-width: 60%; }

    /* ── Loading / error ── */
    .loading-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 1rem;
      padding: 3rem;
      color: var(--muted);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      text-align: center;
      padding: 2rem;
      color: var(--red);
    }
    .chip-tag {
      display: inline-block;
      background: rgba(16,185,129,.15);
      color: var(--green);
      border-radius: 2rem;
      padding: .2rem .65rem;
      font-size: .75rem;
      font-weight: 600;
      margin-left: .4rem;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <img src="logo_pegasus.png" alt="Pegasus Logo" />
    </div>
    <div id="estab-name" class="estab-name">Carregando...</div>
    <div id="estab-type" class="estab-type"></div>
  </header>

  <!-- Steps -->
  <div class="steps" id="steps-bar">
    <div class="step-dot" id="s1"></div>
    <div class="step-dot" id="s2"></div>
    <div class="step-dot" id="s3"></div>
    <div class="step-dot" id="s4"></div>
  </div>

  <main id="main" style="width:100%;max-width:480px"></main>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://fdoecadsyvbhjgasdbxk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkb2VjYWRzeXZiaGpnYXNkYnhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMzgyNDMsImV4cCI6MjA4ODgxNDI0M30.2XcUlosPv-j1JfTC7OjN7gt5zjd5jlq0p7-cpDujTZ8';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    /* ── State ── */
    const state = {
      step: 1,
      estabId: null,
      estab: null,
      servicos: [],
      staff: [],
      selectedStaffId: null,
      selectedIds: new Set(),
      slots: [],
      selectedSlot: null,
      clienteName: localStorage.getItem('pegasus_cliente_name') || '',
      clientePhone: localStorage.getItem('pegasus_cliente_phone') || '',
    };

    function formatPhone(value) {
      if (!value) return ""
      let val = value.replace(/\D/g, '')
      if (val.length > 11) val = val.slice(0, 11)
      if (val.length > 10) {
        return `(${val.slice(0, 2)}) ${val.slice(2, 7)}-${val.slice(7)}`
      } else if (val.length > 6) {
        return `(${val.slice(0, 2)}) ${val.slice(2, 6)}-${val.slice(6)}`
      } else if (val.length > 2) {
        return `(${val.slice(0, 2)}) ${val.slice(2)}`
      } else if (val.length > 0) {
        return `(${val}`
      }
      return val
    }

    function ensureCountryCode(ph) {
      if (!ph) return '';
      const cleaned = ph.replace(/\D/g, '');
      // If it's a standard BR number (10/11 digits), ALWAYS prepend +55
      if (cleaned.length === 10 || cleaned.length === 11) {
        return '+55' + cleaned;
      }
      // If it has 12/13 digits, assume it already has a country code (like 55...)
      if (cleaned.length === 12 || cleaned.length === 13) {
        return '+' + cleaned;
      }
      return ph;
    }

    /* ── Init ── */
    const params = new URLSearchParams(location.search);
    let urlEstab = params.get('estab')?.trim() || params.get('id')?.trim();
    
    // Recovery Logic: Use URL or fallback to last known EstabId
    if (urlEstab) {
      state.estabId = urlEstab;
      localStorage.setItem('pegasus_last_estab_id', urlEstab);
    } else {
      state.estabId = localStorage.getItem('pegasus_last_estab_id');
    }
    
    const urlName = params.get('nome');
    const urlPhone = params.get('telefone') || params.get('phone');
    
    if (urlName) state.clienteName = urlName;
    if (urlPhone) state.clientePhone = formatPhone(urlPhone);

    if (!state.estabId) {
      document.getElementById('main').innerHTML = `
        <div class="error-msg" style="text-align:center; padding: 2rem;">
          <div style="font-size: 3rem; margin-bottom: 1rem;">❌</div>
          <h3 style="margin-bottom: 0.5rem;">Link Inválido</h3>
          <p style="color: var(--muted); font-size: 0.9rem;">Solicite o link de agendamento correto ao estabelecimento.</p>
        </div>`;
    } else {
      bootstrap();
    }

    async function bootstrap() {
      showLoading();
      try {
        const [estabRes, servicosRes, staffRes] = await Promise.all([
          sb.from('estabelecimentos').select('*').eq('id', state.estabId).maybeSingle(),
          sb.from('servicos').select('id, nome, preco, duracao_minutos, cobra_reserva, taxa_reserva, funcionarios_ids').eq('estabelecimento_id', state.estabId).order('nome'),
          sb.from('funcionarios').select('id, nome, ativo').eq('estabelecimento_id', state.estabId).eq('ativo', true).order('nome')
        ]);
        
        if (estabRes.error) throw estabRes.error;
        if (!estabRes.data) throw new Error('Estabelecimento não encontrado ou ID inválido.');
        if (servicosRes.error) console.warn('Erro ao carregar serviços:', servicosRes.error);

        state.estab = estabRes.data;
        state.servicos = (servicosRes.data || []).map(s => ({
          ...s,
          // Normaliza IDs de profissionais removendo prefixo 'owner-' de dados legados
          funcionarios_ids: (s.funcionarios_ids || []).map(id => String(id).replace('owner-', ''))
        }));

        // Build staff list: owner first (only if active), then active employees
        const ownerActive = state.estab.ativo !== false;
        const staff = [];
        if (ownerActive) {
          staff.push({ id: state.estabId, nome: state.estab.nome_completo || state.estab.nome_fantasia || 'Proprietário' });
        }
        const employees = (staffRes.data || []).map(f => ({ id: f.id, nome: f.nome }));
        state.staff = [...staff, ...employees];
        // Pre-select the first professional
        if (state.staff.length > 0) state.selectedStaffId = state.staff[0].id;

        if (state.estab.tipo?.toLowerCase() === 'salao') {
           document.body.classList.add('theme-salao');
        }

        document.getElementById('estab-name').textContent = state.estab.nome_completo || state.estab.nome_fantasia || 'Estabelecimento';
        document.getElementById('estab-type').textContent = state.estab.tipo || 'Estabelecimento';

        renderStep1();
      } catch (e) {
        document.getElementById('main').innerHTML = `
          <div class="error-msg">
            ❌ Não foi possível carregar o estabelecimento.<br>
            <small style="opacity:0.7; font-size: 0.75rem;">Erro: ${e.message || e}</small>
          </div>`;
        console.error('[bootstrap] Erro fatal:', e);
      }
    }

    /* ── Step indicators ── */
    function updateStepBar() {
      for (let i = 1; i <= 4; i++) {
        const el = document.getElementById('s' + i);
        el.className = 'step-dot' + (i < state.step ? ' done' : i === state.step ? ' active' : '');
      }
    }

    function showLoading() {
      document.getElementById('main').innerHTML = `
        <div class="loading-wrap">
          <div class="spinner"></div>
          <span>Carregando...</span>
        </div>`;
    }

    /* ═══════════════════════════════════════
       STEP 1 — Nome do cliente
    ═══════════════════════════════════════ */
    function renderStep1() {
      state.step = 1;
      updateStepBar();
      document.getElementById('main').innerHTML = `
        <div class="card">
          <div class="section-title">👋 Confirmar seus dados</div>
          <p style="font-size:.9rem;color:var(--muted);margin-bottom:1.1rem;">
            Seu agendamento será identificado com essas informações.
          </p>
          <input id="nome-input" class="input" type="text" placeholder="Seu nome completo" maxlength="50" autocomplete="given-name" autofocus />
          <input id="phone-input" class="input" type="tel" placeholder="Seu WhatsApp (Ex: 11 99999-9999)" maxlength="15" style="margin-top:0.7rem;" />
          <button class="btn" id="btn-step1" style="margin-top:1rem;">Próximo →</button>
        </div>`;

      const input = document.getElementById('nome-input');
      const phone = document.getElementById('phone-input');
      const btn = document.getElementById('btn-step1');
      if (state.clienteName) input.value = state.clienteName;
      if (state.clientePhone) phone.value = state.clientePhone;

      phone.addEventListener('input', (e) => {
        e.target.value = formatPhone(e.target.value);
      });

      input.addEventListener('keydown', e => { if (e.key === 'Enter') next1(); });
      btn.addEventListener('click', next1);

      function next1() {
        const v = input.value.trim();
        const ph = phone.value.trim();
        if (!v || v.length < 2) { input.style.borderColor = 'var(--red)'; return; } else { input.style.borderColor = ''; }
        if (!ph || ph.length < 10) { phone.style.borderColor = 'var(--red)'; return; } else { phone.style.borderColor = ''; }
        state.clienteName = v;
        state.clientePhone = ph;
        
        // Save for next time
        localStorage.setItem('pegasus_cliente_name', v);
        localStorage.setItem('pegasus_cliente_phone', ph);
        
        renderStep2();
      }
    }

    /* ═══════════════════════════════════════
       STEP 2 — Seleção de serviços
    ═══════════════════════════════════════ */
    function renderStep2() {
      state.step = 2;
      updateStepBar();

      const html = `
        <div class="card">
          <div class="section-title">⭐ Escolha os serviços</div>
          <div id="service-list">
            ${state.servicos.length === 0
              ? '<p style="color:var(--muted);text-align:center;padding:1rem 0">Nenhum serviço disponível.</p>'
              : state.servicos.map(s => {
                // Check if service has at least 1 active professional
                const ids = s.funcionarios_ids || [];
                const hasActivePro = ids.length === 0 || ids.some(fid => state.staff.find(p => p.id === fid));
                const disabled = !hasActivePro;
                
                // If disabled, remove from selection
                if (disabled) state.selectedIds.delete(s.id);
                
                return `
                <div class="service-item ${disabled ? 'service-disabled' : ''} ${state.selectedIds.has(s.id) ? 'selected' : ''}" data-id="${s.id}" ${disabled ? 'data-disabled="true"' : ''}>
                  <div class="service-check">${state.selectedIds.has(s.id) ? '✓' : ''}</div>
                  <div class="service-info">
                    <div class="s-name">${s.nome}</div>
                    ${s.duracao_minutos ? `<div class="s-dur">⏱ ${s.duracao_minutos} min</div>` : ''}
                    ${disabled ? '<div class="s-dur" style="color:var(--red); font-weight:700;">Indisponível</div>' : ''}
                  </div>
                  <div class="service-price" ${disabled ? 'style="opacity:0.4;"' : ''}>R$${Number(s.preco).toFixed(2).replace('.', ',')}</div>
                </div>`;
              }).join('')}
          </div>
          <div class="total-bar" style="margin-top:.8rem">
            <span class="total-label">Total</span>
            <span class="total-value" id="total-val">R$ 0,00</span>
          </div>
          <button class="btn" id="btn-step2" disabled>Escolher horário →</button>
          <button class="btn outline" onclick="renderStep1()">← Voltar</button>
        </div>`;

      document.getElementById('main').innerHTML = html;
      updateTotal();

      document.querySelectorAll('.service-item').forEach(el => {
        el.addEventListener('click', () => {
          if (el.dataset.disabled === 'true') return; // Block clicks on disabled services
          const id = el.dataset.id;
          if (state.selectedIds.has(id)) { state.selectedIds.delete(id); el.classList.remove('selected'); el.querySelector('.service-check').textContent = ''; }
          else { state.selectedIds.add(id); el.classList.add('selected'); el.querySelector('.service-check').textContent = '✓'; }
          updateTotal();
        });
      });
    }

    function updateTotal() {
      const selected = state.servicos.filter(s => state.selectedIds.has(s.id));
      const total = selected.reduce((acc, s) => acc + Number(s.preco), 0);
      const totalEl = document.getElementById('total-val');
      if (totalEl) totalEl.textContent = 'R$ ' + total.toFixed(2).replace('.', ',');
      const btn = document.getElementById('btn-step2');
      if (btn) {
        btn.disabled = selected.length === 0;
        btn.onclick = selected.length > 0 ? goToStep3 : null;
      }
    }

    async function goToStep3() {
      showLoading();
      await loadSlots();
      renderStep3();
    }

    /* ═══════════════════════════════════════
       STEP 3 — Horários disponíveis
    ═══════════════════════════════════════ */
    async function loadSlots() {
      const now = new Date();
      const end = new Date(now); end.setDate(end.getDate() + 21);

      // Working schedule from DB
      const diasFunc = state.estab.dias_funcionamento || [1,2,3,4,5,6];
      const [aberH, aberM] = (state.estab.horario_abertura || '09:00').split(':').map(Number);
      const [fechH, fechM] = (state.estab.horario_fechamento || '18:00').split(':').map(Number);
      const WORK_START_MIN = aberH * 60 + aberM;
      const WORK_END_MIN   = fechH * 60 + fechM;
      const pausasPadrao   = state.estab.pausas_padrao || [];

      // HELPER: Convert HH:mm to minutes
      function toMinutes(timeStr) {
        if (!timeStr) return null;
        const [h, m] = timeStr.split(':').map(Number);
        return h * 60 + m;
      }

      // 1. Fetch existing bookings filtered by selected professional
      let bookingsQuery = sb
        .from('agendamentos')
        .select('data_agendamento, hora_agendamento, agendamento_status, duracao_minutos, funcionario_id')
        .eq('estabelecimento_id', state.estabId)
        .not('agendamento_status', 'in', '("Cancelado","Recusado","Excluído","Excluido","Concluído","Concluido")');

      // Filter by selected staff if one is chosen
      if (state.selectedStaffId) {
        bookingsQuery = bookingsQuery.eq('funcionario_id', state.selectedStaffId);
      }

      const { data: bookings } = await bookingsQuery;

      // 2. Fetch day-specific exceptions
      const startStr = now.toISOString().split('T')[0];
      const endStr   = end.toISOString().split('T')[0];
      const { data: excecoes } = await sb
        .from('excecoes_agenda')
        .select('*')
        .eq('estabelecimento_id', state.estabId)
        .gte('data_excecao', startStr)
        .lte('data_excecao', endStr);
      
      const excecoesMap = {}; 
      (excecoes || []).forEach(e => {
        if (!excecoesMap[e.data_excecao]) excecoesMap[e.data_excecao] = [];
        excecoesMap[e.data_excecao].push(e);
      });

      // 3. Calculate duration for current request
      const totalDuration = state.servicos
        .filter(s => state.selectedIds.has(s.id))
        .reduce((acc, s) => acc + (s.duracao_minutos || 30), 0) || 30;

      // 4. Pre-process existing bookings into busy ranges
      const dailyBusyRanges = {};
      (bookings || []).forEach(b => {
        const d = b.data_agendamento;
        if (!dailyBusyRanges[d]) dailyBusyRanges[d] = [];
        const start = toMinutes(b.hora_agendamento);
        const dur = Number(b.duracao_minutos || 30);
        dailyBusyRanges[d].push({ start, end: start + dur });
      });

      function isBlocked(cursor) {
        const dayKey = cursor.toISOString().split('T')[0];
        const curMin = cursor.getHours() * 60 + cursor.getMinutes();
        const dow    = cursor.getDay();
        const curEnd = curMin + totalDuration;

        // Block past times
        if (cursor.getTime() < (now.getTime() + 5 * 60000)) return true;

        if (!diasFunc.includes(dow)) return true;
        if (curMin < WORK_START_MIN || curEnd > WORK_END_MIN) return true;

        const dayBookings = dailyBusyRanges[dayKey] || [];
        for (const b of dayBookings) {
          if (curMin < b.end && curEnd > b.start) return true;
        }

        for (const p of pausasPadrao) {
          const ps = toMinutes(p.inicio);
          const pe = toMinutes(p.fim);
          if (ps !== null && pe !== null && curMin < pe && curEnd > ps) return true;
        }

        const dayExcecoes = excecoesMap[dayKey] || [];
        for (const exc of dayExcecoes) {
          if (exc.tipo === 'fechado_dia_todo') return true;
          if (exc.tipo === 'fechado_resto_do_dia') {
            const es = toMinutes(exc.inicio);
            // Se não tem horário de início, bloqueia o dia inteiro a partir da abertura
            if (es === null || curMin >= es) return true;
          }
          if (exc.tipo === 'pausa') {
            const es = toMinutes(exc.inicio);
            const ee = toMinutes(exc.fim);
            if (es !== null && ee !== null && curMin < ee && curEnd > es) return true;
          }
        }
        return false;
      }

      const slots = [];
      let cursor = new Date(now);
      
      // Round to next 15-min interval
      const m = cursor.getMinutes();
      cursor.setMinutes(m % 15 === 0 ? m : m + (15 - (m % 15)), 0, 0);

      while (slots.length < 2 && cursor < end) {
        if (!isBlocked(cursor)) {
          slots.push(new Date(cursor));
        }
        cursor = new Date(cursor.getTime() + 15 * 60000);

        const curMin = cursor.getHours() * 60 + cursor.getMinutes();
        if (curMin >= WORK_END_MIN) {
          cursor.setDate(cursor.getDate() + 1);
          cursor.setHours(Math.floor(WORK_START_MIN / 60), WORK_START_MIN % 60, 0, 0);
        }
      }
      state.slots = slots;
    }

    function renderStep3() {
      state.step = 3;
      updateStepBar();
      const fmtDate = d => d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
      const fmtTime = d => d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

      // 1. Filter staff based on selected services
      const selectedServices = state.servicos.filter(s => state.selectedIds.has(s.id));
      
      // A professional is valid if they are included in ALL selected services' funcionarios_ids
      let filteredStaff = state.staff.filter(person => {
        return selectedServices.every(srv => {
          const srvIds = srv.funcionarios_ids || [];
          if (srvIds.length === 0) return true;
          return srvIds.includes(person.id);
        });
      });

      // If filtering results in nothing (shouldn't happen with correct DB data), show all as fallback
      if (filteredStaff.length === 0) filteredStaff = state.staff;

      // Ensure state.selectedStaffId is valid for the new list
      if (!filteredStaff.find(s => s.id === state.selectedStaffId)) {
        state.selectedStaffId = filteredStaff[0].id;
      }

      const currentStaff = state.staff.find(s => s.id === state.selectedStaffId) || filteredStaff[0];

      // Staff Dropdown HTML
      const staffHtml = filteredStaff.length > 1 ? `
        <div class="section-title" style="margin-bottom:0.6rem;">👤 Escolha o profissional</div>
        <div class="staff-dropdown-container" style="position:relative; margin-bottom:1.5rem;">
          <div id="staff-dropdown-trigger" style="display:flex; justify-content:space-between; align-items:center; padding:0.9rem 1.1rem; background:var(--surface2); border:1.5px solid var(--border); border-radius:var(--radius); cursor:pointer; transition:all 0.2s;">
            <span style="font-weight:700; font-size:0.95rem; color:var(--text);">${currentStaff.nome}</span>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition:transform 0.3s;" id="staff-chevron"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
          <div id="staff-dropdown-options" style="display:none; position:absolute; top:calc(100% + 5px); left:0; width:100%; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); z-index:100; overflow:hidden; animation: slideIn 0.2s ease-out;">
            ${filteredStaff.map(s => `
              <div class="staff-option" data-sid="${s.id}" style="padding:0.9rem 1.1rem; cursor:pointer; font-weight:600; font-size:0.9rem; transition:background 0.2s; ${state.selectedStaffId === s.id ? 'background:rgba(0,0,0,0.03); color:var(--primary);' : ''}">
                ${s.nome}
                ${state.selectedStaffId === s.id ? '<span style="float:right;">✓</span>' : ''}
              </div>
            `).join('')}
          </div>
        </div>
        <style>
          @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
          .staff-option:hover { background: var(--surface2); }
        </style>
      ` : '';

      const slotsHtml = state.slots.length === 0
        ? '<p style="color:var(--muted);text-align:center;padding:1.5rem 0">Nenhum horário disponível nos próximos dias.</p>'
        : state.slots.map((slot, i) => {
          const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
          let dateFinal = fmtDate(slot);
          if (slot.toDateString() === tomorrow.toDateString()) dateFinal += ' (Amanhã)';
          return `
          <div class="slot-item ${state.selectedSlot?.getTime() === slot.getTime() ? 'selected' : ''}" data-i="${i}">
            <div class="slot-icon">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="3" y1="10" x2="21" y2="10"></line>
                <text x="12" y="19" text-anchor="middle" font-size="9" font-weight="900" fill="currentColor" stroke="none" style="font-family: 'Inter', sans-serif;">${slot.getDate()}</text>
              </svg>
            </div>
            <div class="slot-info">
              <div class="s-date">${dateFinal}</div>
              <div class="s-time">${fmtTime(slot)}</div>
            </div>
          </div>`;
        }).join('');

      document.getElementById('main').innerHTML = `
        <div class="card">
          <div class="section-title">🕐 Próximos horários disponíveis</div>
          ${staffHtml}
          <div id="slots-container">${slotsHtml}</div>
          <button class="btn" id="btn-step3" disabled>Confirmar agendamento →</button>
          <button class="btn outline" onclick="renderStep2()">← Voltar</button>
        </div>`;

      // Dropdown Logic
      const trigger = document.getElementById('staff-dropdown-trigger');
      const options = document.getElementById('staff-dropdown-options');
      const chevron = document.getElementById('staff-chevron');

      if (trigger) {
        trigger.onclick = (e) => {
          e.stopPropagation();
          const isVisible = options.style.display === 'block';
          options.style.display = isVisible ? 'none' : 'block';
          chevron.style.transform = isVisible ? 'rotate(0deg)' : 'rotate(180deg)';
        };

        // Close when clicking outside
        document.addEventListener('click', () => {
          if (options) {
            options.style.display = 'none';
            if (chevron) chevron.style.transform = 'rotate(0deg)';
          }
        }, { once: true });

        // Select option
        document.querySelectorAll('.staff-option').forEach(opt => {
          opt.onclick = async (e) => {
            e.stopPropagation();
            state.selectedStaffId = opt.dataset.sid;
            state.selectedSlot = null;
            
            // Auto-close dropdown
            options.style.display = 'none';
            chevron.style.transform = 'rotate(0deg)';

            // Update UI (loading)
            const staffName = state.staff.find(s => s.id === state.selectedStaffId)?.nome || '';
            trigger.querySelector('span').textContent = staffName;

            const container = document.getElementById('slots-container');
            container.innerHTML = '<div class="loading-wrap" style="padding:1.5rem"><div class="spinner"></div><span>Buscando horários...</span></div>';
            
            await loadSlots();

            // Re-render slots
            const newSlotsHtml = state.slots.length === 0
              ? '<p style="color:var(--muted);text-align:center;padding:1.5rem 0">Nenhum horário disponível nos próximos dias.</p>'
              : state.slots.map((slot, i) => {
                const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
                let df = fmtDate(slot);
                if (slot.toDateString() === tomorrow.toDateString()) df += ' (Amanhã)';
                return `<div class="slot-item" data-i="${i}"><div class="slot-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line><text x="12" y="19" text-anchor="middle" font-size="9" font-weight="900" fill="currentColor" stroke="none" style="font-family:'Inter',sans-serif;">${slot.getDate()}</text></svg></div><div class="slot-info"><div class="s-date">${df}</div><div class="s-time">${fmtTime(slot)}</div></div></div>`;
              }).join('');
            container.innerHTML = newSlotsHtml;

            // Re-attach slot listeners
            container.querySelectorAll('.slot-item').forEach(el => {
              el.addEventListener('click', () => {
                container.querySelectorAll('.slot-item').forEach(e => e.classList.remove('selected'));
                el.classList.add('selected');
                state.selectedSlot = state.slots[Number(el.dataset.i)];
                updateStep3Btn();
              });
            });
            updateStep3Btn();
          };
        });
      }

      // Pre-select if only 1 slot
      if (state.slots.length === 1) { state.selectedSlot = state.slots[0]; document.querySelector('.slot-item')?.classList.add('selected'); updateStep3Btn(); }

      document.querySelectorAll('#slots-container .slot-item').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('.slot-item').forEach(e => e.classList.remove('selected'));
          el.classList.add('selected');
          state.selectedSlot = state.slots[Number(el.dataset.i)];
          updateStep3Btn();
        });
      });
    }

    function updateStep3Btn() {
      const btn = document.getElementById('btn-step3');
      if (btn) { btn.disabled = !state.selectedSlot; btn.onclick = goToStep4; }
    }

    /* ═══════════════════════════════════════
       STEP 4 — Confirmação + PIX
    ═══════════════════════════════════════ */
    function goToStep4() { renderStep4(); }

    function renderStep4() {
      state.step = 4;
      updateStepBar();

      const selected = state.servicos.filter(s => state.selectedIds.has(s.id));
      const total = selected.reduce((acc, s) => acc + Number(s.preco), 0);
      const totalTaxa = selected.reduce((acc, s) => acc + (s.cobra_reserva ? Number(s.taxa_reserva) : 0), 0);
      const precisaPix = totalTaxa > 0;
      const chave = state.estab?.chave_pix;

      const fmtDt = d => d.toLocaleString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      const staffName = state.staff.find(s => s.id === state.selectedStaffId)?.nome || '';

      const pixSection = precisaPix && chave ? `
        <div class="pix-box" style="margin-top:1rem">
          <div class="pix-title">💳 Taxa de Reserva — R$ ${totalTaxa.toFixed(2).replace('.', ',')}</div>
          <p style="font-size:.82rem;color:var(--muted);margin-bottom:.75rem">
            Realize o PIX abaixo para confirmar sua reserva. Após o pagamento, envie o comprovante para o Whatsapp do estabelecimento.
          </p>
          <div class="pix-value">
            <span id="chave-pix-txt" style="word-break:break-all;flex:1;margin-right:.75rem">${chave}</span>
            <button class="copy-btn" onclick="copyPix()">Copiar</button>
          </div>
        </div>` : '';

      document.getElementById('main').innerHTML = `
        <div class="card">
          <div class="section-title">✅ Confirmar agendamento</div>
          <div class="summary-row"><span class="label">Nome</span><span class="value">${state.clienteName}</span></div>
          <div class="summary-row"><span class="label">Serviços</span><span class="value">${selected.map(s => s.nome).join(', ')}</span></div>
          <div class="summary-row"><span class="label">Horário</span><span class="value">${fmtDt(state.selectedSlot)}</span></div>
          ${staffName ? `<div class="summary-row"><span class="label">Profissional</span><span class="value">${staffName}</span></div>` : ''}
          <div class="summary-row"><span class="label">Total</span><span class="value" style="color:var(--primary)">R$ ${total.toFixed(2).replace('.', ',')}</span></div>
          ${precisaPix ? `<div class="summary-row"><span class="label">Taxa reserva</span><span class="value" style="color:var(--yellow)">R$ ${totalTaxa.toFixed(2).replace('.', ',')} <span class="chip-tag">PIX</span></span></div>` : ''}
          ${pixSection}
          <button class="btn" id="btn-confirm">🎉 Confirmar agora</button>
          <button class="btn outline" onclick="renderStep3()">← Voltar</button>
        </div>`;

      document.getElementById('btn-confirm').addEventListener('click', submitBooking);
    }

    async function submitBooking() {
      const btn = document.getElementById('btn-confirm');
      btn.disabled = true; btn.textContent = 'Enviando...';

      const selected = state.servicos.filter(s => state.selectedIds.has(s.id));
      const totalTaxa = selected.reduce((acc, s) => acc + (s.cobra_reserva ? Number(s.taxa_reserva) : 0), 0);
      const totalPreco = selected.reduce((acc, s) => acc + Number(s.preco), 0);
      const totalDuracao = selected.reduce((acc, s) => acc + (Number(s.duracao_minutos) || 30), 0);
      const precisaPix = totalTaxa > 0;

      // Build payload with all required fields
      const obj = {
        estabelecimento_id: state.estabId,
        cliente_nome: state.clienteName,
        cliente_telefone: ensureCountryCode(state.clientePhone || ''),
        servico_nome: selected.map(s => s.nome).join(' + '),
        data_agendamento: state.selectedSlot.toISOString().split('T')[0],
        hora_agendamento: `${state.selectedSlot.getHours().toString().padStart(2,'0')}:${state.selectedSlot.getMinutes().toString().padStart(2,'0')}`,
        agendamento_status: precisaPix ? 'Pendente' : 'Confirmado',
        pagamento_status: !precisaPix,
        taxa_reserva: totalTaxa,
        valor_total: totalPreco,
        duracao_minutos: totalDuracao,
      };

      // servico_id — passa o primeiro serviço selecionado quando disponível
      if (selected.length > 0 && selected[0].id) {
        obj.servico_id = selected[0].id;
      }

      // funcionario_id — profissional selecionado
      if (state.selectedStaffId) {
        obj.funcionario_id = state.selectedStaffId;
      }

      console.log('[agendamento] inserindo:', obj);
      const { data, error } = await sb.from('agendamentos').insert(obj).select().maybeSingle();

      if (error) {
        console.error('[agendamento] ERRO:', error);
        btn.disabled = false; btn.textContent = '🎉 Confirmar agora';
        alert('Erro ao agendar: ' + error.message + (error.details ? '\n' + error.details : ''));
        return;
      }

      renderSuccess(precisaPix, data);
    }

    function renderSuccess(precisaPix, agendamento) {
      const selected = state.servicos.filter(s => state.selectedIds.has(s.id));
      const total = selected.reduce((acc, s) => acc + Number(s.preco), 0);
      const fmtDt = d => d.toLocaleString('pt-BR', { weekday:'long', day:'2-digit', month:'long', hour:'2-digit', minute:'2-digit' });
      const staffName = state.staff.find(s => s.id === state.selectedStaffId)?.nome || '';

      // Hide steps bar
      document.getElementById('steps-bar').style.display = 'none';

      let successStr = `
          <div class="success-icon">✓</div>
          <h2 style="font-size:1.4rem;font-weight:800;margin-bottom:.5rem">Agendamento confirmado!</h2>
          <p style="color:var(--muted);font-size:.9rem;margin-bottom:1.5rem">
            Te esperamos, ${state.clienteName}! 🙌
          </p>`;

      if (precisaPix) {
        successStr = `
          <div class="success-icon" style="background:var(--yellow);box-shadow:0 0 32px rgba(245,158,11,.4);">⏳</div>
          <h2 style="font-size:1.4rem;font-weight:800;margin-bottom:.5rem">Aguardando Pagamento</h2>
          <p style="color:var(--muted);font-size:.9rem;margin-bottom:1.5rem">
            Sua reserva está pendente. Envie o comprovante do PIX para o Whatsapp do estabelecimento para confirmar.
          </p>`;
        
        // Polling para checar se o estabelecimento confirmou
        if (agendamento && agendamento.id) {
          setInterval(async () => {
             const { data } = await sb.from('agendamentos').select('agendamento_status').eq('id', agendamento.id).maybeSingle();
             if (data && (data.agendamento_status === 'Confirmado' || data.agendamento_status === 'confirmado')) {
                location.reload(); 
             }
          }, 5000);
        }
      }

      document.getElementById('main').innerHTML = `
        <div class="card" style="text-align:center">
          ${successStr}
          <div style="text-align:left; width: 100%">
            <div class="summary-row"><span class="label">Serviços</span><span class="value">${selected.map(s=>s.nome).join(', ')}</span></div>
            <div class="summary-row"><span class="label">Quando</span><span class="value">${fmtDt(state.selectedSlot)}</span></div>
            ${staffName ? `<div class="summary-row"><span class="label">Profissional</span><span class="value">${staffName}</span></div>` : ''}
            <div class="summary-row"><span class="label">Total</span><span class="value" style="color:var(--primary)">R$ ${total.toFixed(2).replace('.', ',')}</span></div>
          </div>
          <p style="color:var(--muted);font-size:.8rem;margin-top:1.25rem">
            Caso precise cancelar, entre em contato diretamente com o estabelecimento.
          </p>
          <button class="btn outline" style="margin-top:1rem" onclick="location.reload()">Novo agendamento</button>
        </div>`;
    }

    function copyPix() {
      const chave = document.getElementById('chave-pix-txt')?.textContent;
      if (!chave) return;
      navigator.clipboard.writeText(chave).then(() => {
        const btn = document.querySelector('.copy-btn');
        if (btn) { btn.textContent = 'Copiado!'; setTimeout(() => btn.textContent = 'Copiar', 2000); }
      });
    }
  </script>
</body>
</html>
