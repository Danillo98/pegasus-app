<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pegasus - Redefinir Senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #b8860b;
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --bg-body: #f9fafb;
            --card-bg: #ffffff;
            --border: #e5e7eb;
            --shadow-premium: 0 20px 50px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: var(--shadow-premium);
            text-align: center;
            border: 1px solid var(--border);
        }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo-container img {
            width: 80px;
            height: auto;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0,0,0,0.05);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .btn-submit:active { transform: translateY(0); }

        .btn-submit:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            font-weight: 500;
        }

        .message.error {
            background: #fee2e2;
            color: #b91c1c;
            display: block;
        }

        .message.success {
            background: #dcfce7;
            color: #15803d;
            display: block;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading .spinner { display: inline-block; }
        .loading .btn-text { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="/logo_pegasus_sem_nome.png" alt="Pegasus">
    </div>

    <h1>Definir Nova Senha</h1>
    <p>Crie uma senha forte para garantir a segurança do seu acesso.</p>

    <form id="reset-form">
        <div class="form-group">
            <label for="password">Nova Senha</label>
            <input type="password" id="password" placeholder="••••••••" required minlength="6">
        </div>
        <div class="form-group">
            <label for="confirm-password">Confirmar Nova Senha</label>
            <input type="password" id="confirm-password" placeholder="••••••••" required minlength="6">
        </div>

        <button type="submit" id="btn-submit" class="btn-submit">
            <div class="spinner"></div>
            <span class="btn-text">Atualizar Senha</span>
        </button>
    </form>

    <div id="message" class="message"></div>

    <div style="margin-top: 30px; font-size: 13px; color: var(--text-secondary);">
        <a href="/" style="color: var(--primary); text-decoration: none; font-weight: 600;">Voltar para o Login</a>
    </div>
</div>

<!-- Supabase Module -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://fdoecadsyvbhjgasdbxk.supabase.co'
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkb2VjYWRzeXZiaGpnYXNkYnhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMzgyNDMsImV4cCI6MjA4ODgxNDI0M30.2XcUlosPv-j1JfTC7OjN7gt5zjd5jlq0p7-cpDujTZ8'
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey)

    const form = document.getElementById('reset-form')
    const btnSubmit = document.getElementById('btn-submit')
    const messageDiv = document.getElementById('message')
    const passInput = document.getElementById('password')
    const confirmInput = document.getElementById('confirm-password')

    form.addEventListener('submit', async (e) => {
        e.preventDefault()

        const password = passInput.value
        const confirmPassword = confirmInput.value

        if (password !== confirmPassword) {
            showMessage('As senhas não coincidem.', 'error')
            return
        }

        setLoading(true)
        messageDiv.style.display = 'none'

        try {
            const { error } = await supabaseClient.auth.updateUser({
                password: password
            })

            if (error) throw error

            showMessage('Senha atualizada com sucesso! Você será redirecionado para o app...', 'success')
            form.reset()
            btnSubmit.disabled = true

            setTimeout(() => {
                window.location.href = '/'
            }, 3000)

        } catch (err) {
            console.error('Erro ao redefinir senha:', err)
            showMessage(err.message || 'Erro ao atualizar senha. Tente novamente.', 'error')
        } finally {
            setLoading(false)
        }
    })

    function showMessage(text, type) {
        messageDiv.textContent = text
        messageDiv.className = 'message ' + type
        messageDiv.style.display = 'block'
    }

    function setLoading(isLoading) {
        if (isLoading) {
            btnSubmit.classList.add('loading')
            btnSubmit.disabled = true
        } else {
            btnSubmit.classList.remove('loading')
            btnSubmit.disabled = false
        }
    }

    // Ao carregar a página, Supabase automaticamente captura o access_token do hash
    // Não precisamos fazer nada especial se estivermos usando o SDK oficial
</script>

</body>
</html>
