<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pegasus - Redefinir Senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --card-white: #ffffff;
            --text-dark: #121212;
            --text-gray: #6b7280;
            --border-light: #e5e7eb;
            --btn-black: #050505;
            --accent-gold: #b8860b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--card-white);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo {
            width: 80px;
            height: auto;
            margin-bottom: 24px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            color: var(--text-dark);
            margin-bottom: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-gray);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            color: var(--text-dark);
        }

        input:focus {
            border-color: var(--text-dark);
            box-shadow: 0 0 0 2px rgba(0,0,0,0.05);
        }

        button {
            width: 100%;
            background: var(--btn-black);
            color: var(--accent-gold);
            border: none;
            padding: 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
            font-family: 'Cinzel', serif;
            letter-spacing: 1.5px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            transform: scale(1.02);
            filter: brightness(1.2);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            font-weight: 500;
        }

        .message.error { background: #fee2e2; color: #b91c1c; display: block; }
        .message.success { background: #dcfce7; color: #15803d; display: block; }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(184, 134, 11, 0.3);
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display:inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <img src="/logo_pegasus_sem_nome.png" alt="Pegasus" class="logo">
    <h1>NOVA SENHA</h1>
    <p class="subtitle">Preencha os campos abaixo para criar sua nova senha.</p>

    <form id="reset-form">
        <div class="form-group">
            <label>Nova Senha</label>
            <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        <div class="form-group">
            <label>Confirmar Senha</label>
            <input type="password" id="confirm-password" placeholder="Digite novamente" required minlength="6">
        </div>

        <button type="submit" id="btn-submit">
            <span id="loader" style="display:none"><div class="spinner"></div></span>
            REDEFINIR SENHA
        </button>
    </form>

    <div id="message" class="message"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://fdoecadsyvbhjgasdbxk.supabase.co'
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkb2VjYWRzeXZiaGpnYXNkYnhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMzgyNDMsImV4cCI6MjA4ODgxNDI0M30.2XcUlosPv-j1JfTC7OjN7gt5zjd5jlq0p7-cpDujTZ8'
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey)

    const form = document.getElementById('reset-form')
    const btnSubmit = document.getElementById('btn-submit')
    const loader = document.getElementById('loader')
    const messageDiv = document.getElementById('message')

    form.addEventListener('submit', async (e) => {
        e.preventDefault()
        const password = document.getElementById('password').value
        const confirmPassword = document.getElementById('confirm-password').value

        if (password !== confirmPassword) {
            return showMsg('As senhas não coincidem.', 'error')
        }

        btnSubmit.disabled = true
        loader.style.display = 'inline-block'
        messageDiv.style.display = 'none'

        try {
            const { error } = await supabaseClient.auth.updateUser({ password })
            if (error) throw error

            showMsg('Senha alterada com sucesso! Você será redirecionado...', 'success')
            setTimeout(() => { window.location.href = '/' }, 3000)
        } catch (err) {
            showMsg(err.message || 'Erro ao atualizar senha.', 'error')
            btnSubmit.disabled = false
            loader.style.display = 'none'
        }
    })

    function showMsg(txt, type) {
        messageDiv.textContent = txt
        messageDiv.className = 'message ' + type
        messageDiv.style.display = 'block'
    }
</script>

</body>
</html>
